# ==============================================================================
# BANK WOORI SAUDARA (BWS) - LEARNING INTEGRATED SYSTEM (LIS)
# DOCKER COMPOSE CONFIGURATION (DEVELOPMENT STACK)
# ==============================================================================
# Services:
#   1. mysql      - MySQL 8.4 LTS Relational Database (Internal 3306, External 3307)
#   2. backend    - Laravel 13 REST API & Security Engine (PHP 8.5 LTS, Port 8000)
#   3. frontend   - Vue 3.5 LTS Admin Portal with Live Hot Reload (Port 5173)
#   4. pwa-portal - React 19 TS Mobile PWA with Live Hot Reload (Port 5174)
# ==============================================================================

name: bws-lis

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.4 LTS Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: bws-lis-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bws_lis_db}
      MYSQL_USER: ${DB_USERNAME:-bws_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bws_secret_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bws_root_pass}
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bws-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-bws_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ----------------------------------------------------------------------------
  # 2. Laravel 13 API Backend (PHP 8.5 LTS)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      target: development
    container_name: bws-lis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "Bank Woori Saudara - LIS"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:BcVxVCmEIe2YRxRFvRLjrkM7yngaeQQKEhxe5nzoe+g=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:${DOCKER_BE_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bws_lis_db}
      DB_USERNAME: ${DB_USERNAME:-bws_admin}
      DB_PASSWORD: ${DB_PASSWORD:-bws_secret_pass}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SEED_ON_START: "false"
    ports:
      - "${DOCKER_BE_PORT:-8000}:8000"
    volumes:
      - ./be:/var/www/html
      - ./be/.env.docker:/var/www/html/.env
      - /var/www/html/vendor
    networks:
      - bws-network

  # ----------------------------------------------------------------------------
  # 3. Vue 3.5 LTS Admin Portal (Frontend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: development
    container_name: bws-lis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_HMR_PORT: ${DOCKER_FE_PORT:-5173}
    ports:
      - "${DOCKER_FE_PORT:-5173}:5173"
    volumes:
      - ./fe:/app
      - /app/node_modules
    networks:
      - bws-network

  # ----------------------------------------------------------------------------
  # 4. React 19 TS Mobile PWA Portal
  # ----------------------------------------------------------------------------
  pwa-portal:
    build:
      context: ./pwa-portal
      dockerfile: Dockerfile
      target: development
    container_name: bws-lis-pwa-portal
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_HMR_PORT: ${DOCKER_PWA_PORT:-5174}
    ports:
      - "${DOCKER_PWA_PORT:-5174}:5174"
    volumes:
      - ./pwa-portal:/app
      - /app/node_modules
    networks:
      - bws-network

# ------------------------------------------------------------------------------
# Persistent Networks & Storage Volumes
# ------------------------------------------------------------------------------
networks:
  bws-network:
    driver: bridge
    name: bws-lis-network

volumes:
  mysql_data:
    driver: local
    name: bws-lis-mysql-data
  postgres_data:
    driver: local
    name: bws-lis-postgres-data
